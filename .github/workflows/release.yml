name: Release

# 2 通りで起動する。
#
# - タグ push（従来どおり）: `git push origin v0.3.32`
# - 手動実行: GitHub の Actions → Release → Run workflow。スマホの GitHub アプリ
#   からも押せる。main の先頭にタグを打ってから同じ手順でビルドする。
#   version を空にすると、最新の正式版（vX.Y.Z。-dev などは除く）の patch を
#   1 つ上げる（v0.3.31 → v0.3.32）。
#
# 手動実行が打つタグは GITHUB_TOKEN で push するので、タグ push 側の起動は
# 二重には走らない（GitHub は GITHUB_TOKEN の push でワークフローを起動しない）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版（例: v0.3.32）。空なら最新の正式版の patch を 1 つ上げる'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact revision without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch exactly the event revision (including the PR merge commit).
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote remove origin 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Authentication is scoped to this fetch process, never saved in .git/config.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=core.hooksPath
          export GIT_CONFIG_VALUE_1=/dev/null
          git fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin "$GITHUB_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 auth GH_TOKEN
          git -c core.hooksPath=/dev/null checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Decide version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::手動リリースは main から実行してください（今は ${GITHUB_REF}）"
            exit 1
          fi

          v="${INPUT_VERSION// /}"
          if [ -z "${v}" ]; then
            latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [ -z "${latest}" ]; then
              echo "::error::正式版のタグが見つかりません。version を指定してください"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            v="v${major}.${minor}.$((patch + 1))"
            echo "latest=${latest} -> ${v}"
          fi

          if ! printf '%s' "${v}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::版の形式が違います: ${v}（例: v0.3.32）"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${v}" >/dev/null; then
            echo "::error::${v} はすでにあります（$(git rev-parse --short "refs/tags/${v}^{commit}")）"
            exit 1
          fi

          git tag "${v}" "${GITHUB_SHA}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/${v}"
          echo "tagged ${v} at ${GITHUB_SHA}"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Install verified go toolchain without Node
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TOOL_VERSION: 1.26.10
        run: |
          python3 .github/ci/toolchain.py go --version "$TOOL_VERSION"
      - name: Build for Raspberry Pi (ARM64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-release-arm64.sh raku-sika-hub-linux-arm64

      - name: Publish CI-built release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" raku-sika-hub-linux-arm64 raku-sika-hub-linux-arm64.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" raku-sika-hub-linux-arm64 raku-sika-hub-linux-arm64.sha256 --verify-tag --generate-notes "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
