<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラクシカ ステーション検証</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><main>
<button id="face" aria-label="作業を選ぶ"><span class="eyes"><i></i><i></i></span><span class="cheek left"></span><span class="cheek right"></span><span class="mouth"></span></button>
<p id="bubble" role="status" aria-live="polite">接続しています</p>
<section id="cards" aria-label="作業内容"></section>
<footer id="actions"></footer>
<button id="analysis-notice" hidden>分析結果を見る</button>
<small>検証モード · 実際の印刷・登録は行いません</small>
</main><dialog id="editor"><h2 id="editor-title"></h2><output id="entry"></output><div id="choices"></div><button id="close-editor">戻る</button></dialog></body></html>
